services:
  floodcheck:
    build: .
    image: atlas/floodcheck:latest
    ports:
      - "8000:7860"                 # open http://localhost:8000
    environment:
      - FLOOD_CORS_ORIGINS=         # e.g. http://localhost:4200 for an Angular dev server
    volumes:
      - ./results:/home/user/app/results
    restart: unless-stopped
